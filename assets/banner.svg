<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Animated gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#1a1e2e">
        <animate attributeName="stop-color" values="#1a1e2e;#0f1923;#1a1e2e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#161b22">
        <animate attributeName="stop-color" values="#161b22;#0d1117;#161b22" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- Radar sweep gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="8"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Radar circles (pulsing) -->
  <circle cx="120" cy="100" r="30" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="20;45;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="100" r="50" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="40;65;40" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="120" cy="100" r="70" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="60;85;60" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.2;0.03;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Radar sweep line -->
  <line x1="120" y1="100" x2="120" y2="30" stroke="#00ff88" stroke-width="1.5" opacity="0.6" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 120 100" to="360 120 100" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Radar center dot -->
  <circle cx="120" cy="100" r="3" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Detected threat blips (blinking) -->
  <circle cx="105" cy="75" r="2" fill="#ff4444" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="85" r="2" fill="#ffaa00" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="95" cy="115" r="2" fill="#ff4444" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <circle cx="150" cy="110" r="1.5" fill="#00aaff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Horizontal scan line (moving) -->
  <rect x="0" y="0" width="900" height="2" fill="url(#scanGrad)" opacity="0.4">
    <animate attributeName="y" values="0;200;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Title text -->
  <text x="220" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    🎯 Awesome Threat Hunting
  </text>
  <text x="220" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#00ff88" filter="url(#glow)">
    Platform
  </text>
  <text x="220" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">
    SaaS Products &amp; Open-Source Projects for Proactive Threat Detection
  </text>

  <!-- Animated accent line under title -->
  <rect x="220" y="125" width="0" height="2" fill="#00ff88" rx="1">
    <animate attributeName="width" values="0;200;200;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Right side decorative elements - threat indicators -->
  <g transform="translate(750, 40)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#1a2332" stroke="#00ff88" stroke-width="0.5" opacity="0.6"/>
    <text x="10" y="16" font-family="monospace" font-size="10" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      THREATS: 3
    </text>
  </g>
  <g transform="translate(750, 75)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#1a2332" stroke="#ffaa00" stroke-width="0.5" opacity="0.6"/>
    <text x="10" y="16" font-family="monospace" font-size="10" fill="#ffaa00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      HUNTING: ON
    </text>
  </g>
  <g transform="translate(750, 110)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#1a2332" stroke="#00aaff" stroke-width="0.5" opacity="0.6"/>
    <text x="10" y="16" font-family="monospace" font-size="10" fill="#00aaff">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite" begin="1s"/>
      STATUS: LIVE
    </text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="188" width="900" height="12" fill="#0d1117" opacity="0.5"/>
  <rect x="0" y="188" width="0" height="2" fill="#00ff88" rx="1">
    <animate attributeName="width" values="0;900;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
